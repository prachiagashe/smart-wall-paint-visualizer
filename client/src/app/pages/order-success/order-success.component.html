<div class="success-page">
  <div class="success-card">
    <div class="success-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    
    <h1>Order Placed Successfully!</h1>
    <p>Thank you for shopping with SmartPaint. Your order has been confirmed and is being processed.</p>
    
    <div class="order-details-box" *ngIf="orderId">
      <p class="label">Order Reference ID</p>
      <p class="value">{{ orderId }}</p>
    </div>
    
    <div class="actions">
      <button routerLink="/my-orders" class="btn-primary">View My Orders</button>
      <button routerLink="/colors" class="btn-outline">Continue Shopping</button>
    </div>
  </div>
</div>
