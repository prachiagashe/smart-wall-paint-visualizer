<div class="page-container">

  <!-- Main Content -->
  <main class="colors-main">
    <div class="title-section-wrapper">
      <div class="title-section">
        <span class="guide-tag">COLORS</span>
        <h1>Find Your Perfect Color</h1>
        <p>Curated interior shades with hex values, categories and available finishes.</p>
      </div>
      <div class="title-action">
        <button class="btn-primary upload-room-btn" routerLink="/upload">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 16 4-4 4 4"/></svg>
          Upload Your Room
        </button>
      </div>
    </div>

    <div class="filters-bar">
      <div class="pills-container">
        <button class="filter-pill" *ngFor="let filter of filters" [class.active]="activeFilter === filter"
          (click)="setFilter(filter)">
          {{ filter }}
        </button>
      </div>

      <div class="search-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" placeholder="Search colors..." [(ngModel)]="searchQuery" />
      </div>
    </div>

    <div class="colors-grid">
      <div class="color-card" *ngFor="let color of filteredColors">
        <div class="color-swatch" [style.background-color]="color.hex"></div>
        <div class="color-info">
          <div class="title-row">
            <h3>{{ color.name }}</h3>
            <button class="btn-heart">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
              </svg>
            </button>
          </div>
          <span class="hex-code">{{ color.hex }}</span>

          <div class="tags-row">
            <span class="tag category-tag" [ngClass]="color.category.toLowerCase()">{{ color.category }}</span>
            <span class="tag finish-tag" *ngFor="let finish of color.finishes">{{ finish }}</span>
          </div>

          <p class="description">{{ color.description }}</p>

          <button class="btn-outline-primary" routerLink="/upload">Try This Color</button>
        </div>
      </div>
    </div>
  </main>


</div>
