<div class="page-container">

  <!-- Main Content -->
  <main class="colors-main">
    
    <div class="header-content-centered">
      <span class="guide-tag">COLORS</span>
      <h1>Explore our curated collection of wall colors and find the perfect shade for your space.</h1>
    </div>

    <div class="search-container-centered">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" placeholder="Search colors..." [(ngModel)]="searchQuery" />
      </div>
    </div>

    <div class="filters-centered">
      <div class="pills-container">
        <button class="filter-pill" *ngFor="let filter of filters" [class.active]="activeFilter === filter"
          (click)="setFilter(filter)">
          {{ filter }}
        </button>
      </div>
    </div>

    <div class="colors-grid" *ngIf="filteredColors.length > 0; else noResults">
      <div class="color-card" *ngFor="let color of filteredColors">
        
        <div class="color-swatch" [style.background-color]="color.hex"></div>
        
        <div class="color-info">
          <div class="title-row">
            <h3>{{ color.name }}</h3>
            <button class="btn-heart" (click)="toggleFavorite(color)" [class.favorited]="isFavorite(color.id)">
              <svg *ngIf="!isFavorite(color.id)" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
              </svg>
              <svg *ngIf="isFavorite(color.id)" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
              </svg>
            </button>
          </div>

          <div class="tags-row">
            <span class="tag category-tag" [ngClass]="color.category.toLowerCase()">{{ color.category }}</span>
            <span class="tag finish-pill" *ngFor="let finish of color.finishes" 
                  [class.active]="selectedFinishes[color.id] === finish"
                  (click)="selectFinish(color.id, finish)">
              {{ finish }}
            </span>
          </div>

          <p class="description">{{ color.description }}</p>

          <button class="btn-outline-primary" (click)="tryColor(color)">Try This Color</button>
        </div>
      </div>
    </div>
    
    <ng-template #noResults>
      <div class="no-results">
        <p>No colors found matching your criteria.</p>
        <button class="btn-outline-primary" (click)="searchQuery = ''; setFilter('All')">Clear Search</button>
      </div>
    </ng-template>

  </main>
</div>
