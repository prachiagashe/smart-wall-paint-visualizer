<header class="app-header">
  <div class="logo">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
    </div>
    <div class="logo-text">
      <span class="brand-name">SmartPaint</span>
      <span class="brand-sub">SMART WALL PAINT VISUALIZER</span>
    </div>
  </div>
  <nav class="main-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
    <a routerLink="/how-it-works" routerLinkActive="active">How It Works</a>
    <a routerLink="/colors" routerLinkActive="active">Colors</a>
    <a routerLink="/dashboard" routerLinkActive="active">My Projects</a>
  </nav>
  <div class="header-actions">
    <a routerLink="/register" class="login-link">Login</a>
    <button class="btn-primary" routerLink="/upload">Get Started</button>
  </div>
</header>
